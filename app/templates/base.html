<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MCP docs assistant{% endblock %}</title>
  <!-- Swap error fragments (4xx/5xx) into the page instead of dropping them. -->
  <meta name="htmx-config" content='{"responseHandling":[{"code":"204","swap":false},{"code":"[2345]..","swap":true}]}'>
  <link rel="stylesheet" href="{{ url_for('static', path='app.css') }}">
  <script src="https://unpkg.com/htmx.org@2.0.4/dist/htmx.min.js" defer></script>
  <script src="https://unpkg.com/htmx-ext-sse@2.2.4/dist/sse.js" defer></script>
  <script src="{{ url_for('static', path='app.js') }}" defer></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="/">MCP docs assistant</a>
    <span class="tagline">Answers from the Model Context Protocol docs, cited by section</span>
    <nav class="site-nav" aria-label="Main">
      <a href="/">Ask</a>
      <a href="/evals">Evals</a>
    </nav>
  </header>
  <main>
    {% block content %}{% endblock %}
  </main>
</body>
</html>
