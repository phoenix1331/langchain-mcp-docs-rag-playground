name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Ruff lint
        run: uv run ruff check .
      - name: Ruff format
        run: uv run ruff format --check .

  test:
    name: Tests and coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: mcp_rag
          POSTGRES_PASSWORD: mcp_rag
          POSTGRES_DB: mcp_rag
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mcp_rag"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Every model and API call is mocked in the tests, so no provider keys are needed;
      # model settings only have to be valid `provider:model` strings.
      DATABASE_URL: postgresql+psycopg://mcp_rag:mcp_rag@localhost:5432/mcp_rag
      ROUTER_MODEL: google_genai:ci-router
      ANSWER_MODEL: google_genai:ci-answer
      EMBED_MODEL: voyageai:voyage-4
      RERANK_MODEL: voyageai:rerank-2.5
      LANGSMITH_TRACING: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: Install dependencies
        run: uv sync --locked
      - name: Enable pgvector
        run: psql postgresql://mcp_rag:mcp_rag@localhost:5432/mcp_rag -c "CREATE EXTENSION IF NOT EXISTS vector"
      - name: Check the database
        run: uv run db-check
      - name: Tests with coverage (90% minimum)
        # shell: bash runs with pipefail, so a coverage failure is not hidden by tee.
        shell: bash
        run: uv run pytest --cov --cov-report=term-missing --cov-fail-under=90 | tee coverage.txt
      - name: Coverage summary
        if: always()
        run: |
          {
            echo '### Coverage'
            echo '```'
            grep -E '^(Name|TOTAL|Required)|^-+' coverage.txt || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
