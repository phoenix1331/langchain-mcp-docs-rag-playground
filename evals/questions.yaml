# Evaluation questions for the MCP docs assistant.
#
# Every key fact was checked against the MCP docs repo at commit d0e246ea3c69.
#
# Fields:
#   id           unique kebab-case id
#   category     version_specific | cross_version | absent_in_version | out_of_scope | direct
#   question     what the user asks
#   spec_version a dated version or "all" (never "latest", so results stay comparable
#                when a new spec version is published)
#   expected     answer:      the graph should retrieve and answer with these facts
#                not_covered: the spec version lacks the feature; a decline, or an answer
#                             that says the version does not define it, both pass
#                decline:     out of scope; the router should decline
#                direct:      greeting or help; answered without retrieval
#   key_facts    facts a correct answer must state (judged by an LLM)
#   sources      source files that contain the facts; retrieval scores a hit when any
#                of them is among the retrieved chunks

# --- Version specific: 2026-07-28 ---------------------------------------------------

- id: discover-purpose
  category: version_specific
  question: What is server/discover used for?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - Servers MUST implement server/discover
    - It advertises the server's supported protocol versions, capabilities and identity
    - Clients may call it before any other request to select a protocol version
  sources:
    - docs/specification/2026-07-28/server/discover.mdx

- id: result-type-values
  category: version_specific
  question: What values can the resultType field of a result have?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - '"complete" means the request completed and the result holds the final content'
    - '"input_required" means more information is needed and the result is an InputRequiredResult'
  sources:
    - docs/specification/2026-07-28/basic/index.mdx
    - docs/specification/2026-07-28/basic/patterns/mrtr.mdx

- id: mrtr-input-required
  category: version_specific
  question: What does an InputRequiredResult contain in the multi round-trip request pattern?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - inputRequests, a map of server-initiated requests the client must fulfil
    - requestState, an opaque string meaningful only to the server
    - Clients MUST NOT inspect, parse or modify requestState
  sources:
    - docs/specification/2026-07-28/basic/patterns/mrtr.mdx

- id: subscriptions-listen
  category: version_specific
  question: How does a client receive list change notifications from a server?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - The client sends a subscriptions/listen request
    - It opens a long-lived notification stream from server to client
    - The client opts in to notification types with a filter such as toolsListChanged
  sources:
    - docs/specification/2026-07-28/basic/patterns/subscriptions.mdx

- id: caching-ttl
  category: version_specific
  question: How do ttlMs and cacheScope control caching of list results?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - ttlMs is a time in milliseconds the client may consider the result fresh
    - cacheScope is either "public" or "private"
    - A ttlMs of 0 means the response should be considered immediately stale
  sources:
    - docs/specification/2026-07-28/server/utilities/caching.mdx

- id: resource-not-found-code
  category: version_specific
  question: Which error code does a server return when a requested resource is not found?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - -32602 (Invalid Params)
    - Clients should also accept -32002 for backwards compatibility
  sources:
    - docs/specification/2026-07-28/server/resources.mdx

- id: stdio-framing
  category: version_specific
  question: How are messages framed on the stdio transport, and what can the server write to stderr?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - The server reads JSON-RPC messages from stdin and writes them to stdout
    - Messages are delimited by newlines and must not contain embedded newlines
    - The server may write UTF-8 strings to stderr for any logging purposes
  sources:
    - docs/specification/2026-07-28/basic/transports/stdio.mdx

- id: streamable-http-headers
  category: version_specific
  question: Which MCP request headers are required on Streamable HTTP POST requests?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - Mcp-Method carries the JSON-RPC method on all requests
    - Mcp-Name carries params.name or params.uri for tools/call, resources/read and prompts/get
  sources:
    - docs/specification/2026-07-28/basic/transports/streamable-http.mdx

- id: elicitation-sensitive-data
  category: version_specific
  question: Can a server use form mode elicitation to ask the user for a password?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - Servers MUST NOT use form mode to request sensitive information
    - Servers MUST use URL mode for interactions involving sensitive information
  sources:
    - docs/specification/2026-07-28/client/elicitation.mdx

- id: sampling-with-tools
  category: version_specific
  question: How can a server let the client's LLM use tools during sampling?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - The server provides a tools array and optional toolChoice in the sampling request
    - Clients must declare the sampling.tools capability
    - Servers must not send tool-enabled sampling requests to clients without that capability
  sources:
    - docs/specification/2026-07-28/client/sampling.mdx

- id: pagination-cursor
  category: version_specific
  question: How does pagination work for list operations?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - Pagination uses an opaque cursor rather than numbered pages
    - Responses include an optional nextCursor field when more results exist
  sources:
    - docs/specification/2026-07-28/server/utilities/pagination.mdx

- id: completion-request
  category: version_specific
  question: How does a client ask a server for argument autocompletion suggestions?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - The client sends a completion/complete request
    - The request identifies what is being completed and the argument value so far
  sources:
    - docs/specification/2026-07-28/server/utilities/completion.mdx

- id: log-level-per-request
  category: version_specific
  question: How does a client set the log level for server log messages?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - The log level is set per request via io.modelcontextprotocol/logLevel in _meta
    - Servers must not emit log notifications for requests that did not include it
  sources:
    - docs/specification/2026-07-28/server/utilities/logging.mdx
    - docs/specification/2026-07-28/changelog.mdx

- id: authorization-iss
  category: version_specific
  question: What must a client do with the iss parameter in an authorization response?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - Authorization servers should include iss per RFC 9207
    - Clients MUST validate a present iss against the recorded issuer before redeeming the code
  sources:
    - docs/specification/2026-07-28/basic/authorization/index.mdx
    - docs/specification/2026-07-28/changelog.mdx

- id: server-primitives
  category: version_specific
  question: What are the three core primitives an MCP server can expose?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - Tools, functions the model can call
    - Resources, read-only data sources for context
    - Prompts, pre-built instruction templates
  sources:
    - docs/docs/2026-07-28/learn/server-concepts.mdx
    - docs/docs/2026-07-28/learn/architecture.mdx

# --- Version specific: earlier versions ---------------------------------------------

- id: transports-2024
  category: version_specific
  question: Which transports does MCP define?
  spec_version: "2024-11-05"
  expected: answer
  key_facts:
    - stdio, over standard in and standard out
    - HTTP with Server-Sent Events (SSE)
    - Clients SHOULD support stdio whenever possible
  sources:
    - docs/specification/2024-11-05/basic/transports.mdx

- id: lifecycle-2024
  category: version_specific
  question: How does a connection start?
  spec_version: "2024-11-05"
  expected: answer
  key_facts:
    - The client sends an initialize request and the server replies with an initialize response
    - The client then sends an initialized notification
    - The protocolVersion sent SHOULD be the latest version the client supports
  sources:
    - docs/specification/2024-11-05/basic/lifecycle.mdx

- id: logging-levels-2024
  category: version_specific
  question: What log levels can servers use?
  spec_version: "2024-11-05"
  expected: answer
  key_facts:
    - The levels follow the syslog severity levels in RFC 5424
    - They range from debug to emergency
  sources:
    - docs/specification/2024-11-05/server/utilities/logging.mdx

- id: ping-2024
  category: version_specific
  question: How does ping work?
  spec_version: "2024-11-05"
  expected: answer
  key_facts:
    - Ping is optional and either the client or the server can send a ping request
    - The receiver MUST respond promptly with an empty response
  sources:
    - docs/specification/2024-11-05/basic/utilities/ping.mdx

- id: tool-annotations-2025-03
  category: version_specific
  question: What are tool annotations and should clients trust them?
  spec_version: "2025-03-26"
  expected: answer
  key_facts:
    - Annotations are optional properties describing tool behaviour, such as read-only or destructive
    - Clients must consider tool annotations untrusted unless they come from trusted servers
  sources:
    - docs/specification/2025-03-26/server/tools.mdx

- id: session-id-2025-03
  category: version_specific
  question: How does the Streamable HTTP transport manage sessions?
  spec_version: "2025-03-26"
  expected: answer
  key_facts:
    - A server may assign a session ID at initialization in the Mcp-Session-Id header
    - Clients MUST include the Mcp-Session-Id header on all subsequent requests
  sources:
    - docs/specification/2025-03-26/basic/transports.mdx

- id: structured-output-2025-06
  category: version_specific
  question: How can a tool return structured output?
  spec_version: "2025-06-18"
  expected: answer
  key_facts:
    - A tool may declare an optional outputSchema
    - Structured content is returned as a JSON object in the structuredContent field
  sources:
    - docs/specification/2025-06-18/server/tools.mdx

- id: protocol-version-header-2025-06
  category: version_specific
  question: Which HTTP header must clients send after negotiating the protocol version?
  spec_version: "2025-06-18"
  expected: answer
  key_facts:
    - The MCP-Protocol-Version header on all subsequent HTTP requests
  sources:
    - docs/specification/2025-06-18/basic/transports.mdx

- id: tasks-2025-11
  category: version_specific
  question: How do task-augmented requests return their results?
  spec_version: "2025-11-25"
  expected: answer
  key_facts:
    - Tasks are experimental in this version
    - The server immediately returns a CreateTaskResult with task data
    - The actual result is available later through tasks/result
  sources:
    - docs/specification/2025-11-25/basic/utilities/tasks.mdx

- id: tool-names-2025-11
  category: version_specific
  question: How long can tool names be?
  spec_version: "2025-11-25"
  expected: answer
  key_facts:
    - Tool names SHOULD be between 1 and 128 characters inclusive
  sources:
    - docs/specification/2025-11-25/server/tools.mdx

# --- Extensions (unversioned) --------------------------------------------------------

- id: oauth-client-credentials
  category: version_specific
  question: How can an MCP client authenticate when there is no user present to approve access?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - The OAuth Client Credentials extension handles machine-to-machine authentication
    - The client uses application credentials, a client ID and secret or a signed JWT assertion
    - Integrations with a human user should use the standard MCP authorization flow instead
  sources:
    - docs/extensions/auth/oauth-client-credentials.mdx

- id: enterprise-managed-authorization
  category: version_specific
  question: How can an organisation control which MCP servers its employees can access?
  spec_version: "2026-07-28"
  expected: answer
  key_facts:
    - The Enterprise-Managed Authorization extension
    - The organisation's identity provider (IdP) is the authoritative decision-maker for access
  sources:
    - docs/extensions/auth/enterprise-managed-authorization.mdx

# --- Cross version -------------------------------------------------------------------

- id: authorization-introduced
  category: cross_version
  question: In which spec version was authorization added, and what is it based on?
  spec_version: all
  expected: answer
  key_facts:
    - Authorization was added in 2025-03-26
    - It is based on OAuth 2.1
  sources:
    - docs/specification/2025-03-26/changelog.mdx
    - docs/specification/2025-03-26/basic/authorization.mdx

- id: batching-history
  category: cross_version
  question: Does MCP support JSON-RPC batching?
  spec_version: all
  expected: answer
  key_facts:
    - Batching support was added in 2025-03-26
    - It was removed again in 2025-06-18
  sources:
    - docs/specification/2025-03-26/changelog.mdx
    - docs/specification/2025-06-18/changelog.mdx

- id: http-sse-replaced
  category: cross_version
  question: What replaced the HTTP with SSE transport, and when?
  spec_version: all
  expected: answer
  key_facts:
    - The Streamable HTTP transport replaced HTTP+SSE
    - The change was made in 2025-03-26
  sources:
    - docs/specification/2025-03-26/changelog.mdx
    - docs/specification/2025-03-26/basic/transports.mdx

- id: initialize-removed
  category: cross_version
  question: What happened to the initialize handshake in the latest spec?
  spec_version: all
  expected: answer
  key_facts:
    - 2026-07-28 removed the initialize / notifications/initialized handshake, making MCP stateless
    - Every request now carries its protocol version and client capabilities in _meta
  sources:
    - docs/specification/2026-07-28/changelog.mdx

- id: sessions-removed
  category: cross_version
  question: Is the Mcp-Session-Id header still part of the Streamable HTTP transport?
  spec_version: all
  expected: answer
  key_facts:
    - Mcp-Session-Id was introduced with Streamable HTTP in 2025-03-26
    - 2026-07-28 removed protocol-level sessions and the Mcp-Session-Id header
  sources:
    - docs/specification/2026-07-28/changelog.mdx
    - docs/specification/2025-03-26/basic/transports.mdx

- id: tasks-moved-to-extension
  category: cross_version
  question: How did tasks change between 2025-11-25 and 2026-07-28?
  spec_version: all
  expected: answer
  key_facts:
    - Tasks were experimental in the core protocol in 2025-11-25
    - 2026-07-28 moved them into an official extension, io.modelcontextprotocol/tasks
    - The blocking tasks/result method was replaced by polling via tasks/get
  sources:
    - docs/specification/2026-07-28/changelog.mdx
    - docs/extensions/tasks/overview.mdx

- id: elicitation-history
  category: cross_version
  question: When was elicitation introduced, and when was URL mode added?
  spec_version: all
  expected: answer
  key_facts:
    - Elicitation was added in 2025-06-18
    - URL mode elicitation was added in 2025-11-25
  sources:
    - docs/specification/2025-06-18/changelog.mdx
    - docs/specification/2025-11-25/changelog.mdx

- id: resource-not-found-code-change
  category: cross_version
  question: Did the error code for a missing resource change between versions?
  spec_version: all
  expected: answer
  key_facts:
    - Earlier versions used -32002
    - 2026-07-28 changed it to -32602 (Invalid Params)
  sources:
    - docs/specification/2026-07-28/changelog.mdx
    - docs/specification/2026-07-28/server/resources.mdx

- id: ping-removed
  category: cross_version
  question: Is ping still part of MCP?
  spec_version: all
  expected: answer
  key_facts:
    - Ping existed in earlier versions
    - 2026-07-28 removed ping
  sources:
    - docs/specification/2026-07-28/changelog.mdx

