[project]
name = "langchain-mcp-docs-rag-playground"
version = "0.1.0"
description = "Agentic RAG over the Model Context Protocol docs, built with LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic-settings>=2.16.2",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.coverage.run]
source = ["app", "ingest"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
