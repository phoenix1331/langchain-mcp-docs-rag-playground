[project]
name = "langchain-mcp-docs-rag-playground"
version = "0.1.0"
description = "Agentic RAG over the Model Context Protocol docs, built with LangChain and LangGraph."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.162.0",
    "jinja2>=3.1.6",
    "langchain>=1.4.7",
    "langchain-classic>=1.0.8",
    "langchain-core>=1.7.3",
    "langchain-google-genai>=4.4.2",
    "langchain-postgres>=0.0.19",
    "langchain-text-splitters>=1.1.3",
    "langchain-voyageai>=0.4.1",
    "langgraph>=1.2.19",
    "markdown-it-py>=4.2.0",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.16.2",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.33",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "sqlalchemy>=2.1.6",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.3",
]

[project.scripts]
db-check = "app.db:main"
ingest = "ingest.cli:main"
query = "app.retrieval.cli:main"
ask = "app.graph.cli:main"
evals = "evals.run:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "ingest", "evals"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
# The breadcrumb separator in heading paths is a deliberate "›".
allowed-confusables = ["›"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["db: needs the live Postgres database (skipped when unreachable)"]

[tool.coverage.run]
source = ["app", "ingest"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
